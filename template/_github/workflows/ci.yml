name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: |
          if [ -f scripts/migrate.ts ]; then
            cp .env.test .env
            npm run migrate
          fi
      - run: npm run check
